<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Celwerx</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{--bg:#1c1f24;--panel:#252930;--panel2:#2e333b;--line:#3a4049;--text:#e7e9ec;--muted:#98a1ac;--accent:#4f9cf9;--accent2:#2f6fc6;--key:#4e7fd9;--hold:#33507f;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:52px 1fr;grid-template-rows:auto auto 1fr var(--tlh,230px);grid-template-areas:"top top" "opts opts" "tools stage" "tl tl"}
#top{grid-area:top;min-width:0;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
#top .brand{font-weight:700;letter-spacing:.3px;margin-right:4px;color:#fff}
#projName{width:130px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
#status{margin-left:auto;color:var(--muted);font-size:12px;padding-left:10px}
#opts{grid-area:opts;min-width:0;display:flex;align-items:center;gap:12px;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
#opts label{display:flex;align-items:center;gap:6px;color:var(--muted)}
#opts input[type=range]{width:110px;accent-color:var(--accent)}
#opts .num{width:44px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 4px;text-align:right}
.sw{display:flex;gap:3px;align-items:center}
.sw button{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.25);padding:0;cursor:pointer}
input[type=color]{width:30px;height:24px;border:1px solid var(--line);border-radius:5px;padding:0;background:none;cursor:pointer}
#tools{grid-area:tools;min-width:0;min-height:0;display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
.tool{width:40px;height:40px;flex:none;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.tool:hover{background:var(--panel2)}
.tool.on{background:var(--accent2);border-color:var(--accent)}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#stageBox{grid-area:stage;position:relative;min-width:0;min-height:0;background:#15171b}
#area{position:absolute;inset:0;overflow:auto;display:flex;touch-action:none}
#wrap{margin:auto;position:relative;flex:none;box-shadow:0 0 0 1px #000,0 8px 30px rgba(0,0,0,.5)}
#wrap canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}
#ov{pointer-events:none}
#zoomBox{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;z-index:5}
#zoomBox button,#zoomBox span{background:rgba(37,41,48,.92);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:30px;text-align:center}
#zoomBox button{cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#566070}
.btn.on{background:var(--accent2);border-color:var(--accent)}
.btn.primary{background:var(--accent2);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.sep{width:1px;height:22px;background:var(--line);flex:none}
#timeline{grid-area:tl;min-width:0;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);min-height:0}
#tlResize{height:6px;cursor:ns-resize;flex:none;background:linear-gradient(var(--line),var(--line)) center/40px 2px no-repeat;touch-action:none}
#tlBar{display:flex;gap:5px;align-items:center;padding:2px 8px 6px;overflow-x:auto;white-space:nowrap;flex:none}
#tlBar .zbtn{min-width:30px;padding:5px 7px}
#tlBar .num{width:46px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 4px;text-align:right}
#tlBar select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px}
#fLbl{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
#tlGrid{flex:1;overflow:auto;position:relative;background:#1f2328;min-height:0}
.tlRow{display:flex;width:max-content;min-width:100%}
.tlHeadRow{position:sticky;top:0;z-index:3}
.tlL{position:sticky;left:0;z-index:2;width:180px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid #2a2f36;height:36px;cursor:pointer}
.tlCorner{z-index:4;height:24px;border-bottom:1px solid var(--line)}
.tlRow.cur .tlL{background:#33404f}
.ib{width:24px;height:24px;flex:none;border:0;border-radius:5px;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--text);padding:0}
.ib:hover{background:var(--panel2)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.off{opacity:.35}
.ib.lockon{color:#f5a524}
.ib.lockoff{opacity:.3}
.lname{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 4px;color:var(--text)}
.lname:focus{background:var(--bg);border-color:var(--line);outline:none}
.tlCells{display:flex}
.c,.hc{width:var(--cw,24px);flex:none}
.hc{height:24px;font-size:10px;color:var(--muted);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;background:var(--panel);border-bottom:1px solid var(--line);border-right:1px solid #2c3138;cursor:ew-resize;touch-action:pan-x}
.hc.sec{border-left:1px solid #59626e}
.hc.now{position:relative;color:#fff;font-weight:700}
.hc.now::after{content:'';position:absolute;left:50%;bottom:0;width:10px;height:7px;transform:translateX(-50%);background:var(--ph,#ff5a5f);clip-path:polygon(0 0,100% 0,50% 100%)}
#playhead{position:absolute;top:0;width:1.5px;background:var(--ph,#ff5a5f);z-index:1;pointer-events:none;transform:translateX(-0.75px);box-shadow:0 0 0 .5px rgba(0,0,0,.35)}
.c{height:36px;overflow:hidden;white-space:nowrap;background:#23272d;border-right:1px solid #2c3138;border-bottom:1px solid #2c3138;font-size:10px;display:flex;align-items:center;padding-left:4px;color:#fff;cursor:pointer}
.c.k{background:var(--key);border-left:2px solid #a8c6ff;padding-left:2px}
.c.h{background:var(--hold);border-right-color:var(--hold)}
.c.end{border-right:1px solid #10151c;position:relative}
.c.k,.c.h,.c.camk,.c.rigk{cursor:grab;touch-action:none}
.c.end::after{content:'';position:absolute;right:0;top:4px;bottom:4px;width:min(12px,45%);cursor:ew-resize;border-right:3px solid rgba(255,255,255,.55);background:linear-gradient(90deg,transparent,rgba(255,255,255,.12))}
#tlGhost{position:absolute;z-index:1;pointer-events:none;border:2px dashed #f5a524;background:rgba(245,165,36,.18);border-radius:3px;display:none}
#tlGhost.swap{border-color:#4f9cf9;background:rgba(79,156,249,.22)}
#tlGhost span{position:absolute;left:4px;top:-18px;font-size:11px;color:#fff;background:#111;padding:0 4px;border-radius:3px;white-space:nowrap}
.tlRow.cur .c.now{outline:1.5px solid rgba(255,255,255,.85);outline-offset:-1.5px}
#toast{position:fixed;left:50%;bottom:calc(var(--tlh,230px) + 16px);transform:translateX(-50%);background:#0d0f12;border:1px solid var(--line);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto;-webkit-user-select:text;user-select:text}
.modal h2{margin:0 0 12px;font-size:16px}
.modal .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.modal .row input,.modal .row select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.modal .list{display:flex;flex-direction:column;gap:8px}
.modal .list .btn{text-align:left;padding:10px 12px}
.modal .list .btn small{display:block;color:var(--muted);margin-top:2px}
.modal table{border-collapse:collapse;width:100%;font-size:12px}
.modal td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.modal td:first-child{white-space:nowrap;color:#fff;font-family:ui-monospace,Menlo,monospace}
.modal p{color:var(--muted);margin:6px 0 10px}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:10px}
.bar div{height:100%;width:0;background:var(--accent)}
.c.camk{background:#6d52c4;justify-content:center;padding:0;font-size:10px;color:#fff}
.c.camt{background:#3a305c;border-right-color:#3a305c}
.tlRow.special .tlL{cursor:default}
.tlRow.special .tlL .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px;color:var(--muted)}
.snd{position:relative;height:30px;border-bottom:1px solid #2c3138;cursor:pointer;flex:none;background:#20252b}
.snd canvas{position:absolute;top:0;height:30px}
.snd .head{display:none}
.snd .empty{position:sticky;left:190px;display:inline-block;padding:7px 10px;color:var(--muted);font-size:12px}
.ib.on{color:var(--accent)}
.ib.kind{font-size:10px;font-weight:700;color:var(--muted);width:20px}
.c.rigk{background:#b7791f;justify-content:center;padding:0;font-size:10px;color:#fff}
.c.rigt{background:#4a3a1c;border-right-color:#4a3a1c}
#opts select,#opts input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 5px}
.seg{display:flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:6px 0 0 6px}.seg .btn:last-child{border-radius:0 6px 6px 0;border-left:0}
.hide{display:none!important}
#jointBar{position:absolute;left:10px;right:10px;top:10px;z-index:6;background:rgba(37,41,48,.96);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#palPanel{position:absolute;right:10px;top:10px;width:250px;max-height:calc(100% - 60px);overflow:auto;z-index:7;background:rgba(37,41,48,.98);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#palPanel .ph{display:flex;gap:6px;align-items:center}
#palPanel input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--text)}
#palGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px}
#palGrid button{aspect-ratio:1;border-radius:6px;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
#palGrid button.sel{outline:2px solid #fff;outline-offset:2px}
#palPanel .row2{display:flex;gap:6px;flex-wrap:wrap}
#palPanel .row2 .btn{flex:1;padding:5px 6px}
#palPanel .muted{color:var(--muted);font-size:12px}
#top{gap:4px}
.mb{background:transparent;border:0;color:var(--text);padding:6px 9px;border-radius:6px;cursor:pointer;flex:none}
.mb:hover,.mb.open{background:var(--panel2)}
.tb{width:32px;height:30px;display:grid;place-items:center;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--text);cursor:pointer;flex:none;padding:0}
.tb:hover:not(:disabled){background:var(--panel2)}.tb:disabled{opacity:.3;cursor:default}.tb.on{background:var(--accent2);border-color:var(--accent)}
.tb.wide{width:auto;display:flex;align-items:center;gap:5px;padding:0 9px}
.tb .tbl{font-size:13px}
.tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu{position:fixed;z-index:300;min-width:230px;max-width:calc(100vw - 8px);max-height:calc(100vh - 8px);overflow:auto;background:#2b3038;border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column}
.mi{display:flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--text);padding:6px 8px;border-radius:5px;text-align:left;cursor:pointer;font:inherit;white-space:nowrap}
.mi:hover:not(:disabled),.mi.open{background:var(--accent2)}.mi:disabled{opacity:.4;cursor:default}
.mi .mc{width:14px;flex:none}.mi .ml{flex:1}.mi .mk{color:var(--muted);font-size:12px;margin-left:16px}
.msep{height:1px;background:var(--line);margin:4px 6px;flex:none}
@media (pointer:coarse){.mi{padding:10px 10px}}
#histPanel{position:absolute;right:10px;top:10px;width:260px;max-height:calc(100% - 60px);overflow:auto;z-index:7;background:rgba(37,41,48,.98);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#histPanel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hrow{display:flex;justify-content:space-between;gap:8px;background:transparent;border:0;color:var(--text);text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;font:inherit}
.hrow:hover{background:var(--panel2)}.hrow.cur{background:var(--accent2)}.hrow.future{opacity:.45}.hrow small{color:var(--muted);flex:none}
#onionPop{position:fixed;z-index:250;background:#2b3038;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);width:min(560px,calc(100vw - 16px))}
#onionPop h3{margin:0 0 4px;font-size:14px}#onionPop p{margin:0 0 10px;color:var(--muted);font-size:12px}
#eq{display:flex;align-items:flex-end;gap:3px;touch-action:none;user-select:none;padding:4px 0;cursor:ns-resize}
#eq .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
#eq .trk{width:100%;max-width:20px;height:96px;background:#1b1f25;border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden}
#eq .fil{position:absolute;left:0;right:0;bottom:0}
#eq .lb{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
#eq .mid{flex:none;width:18px;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
#eq .mid .trk{background:var(--accent);border-color:var(--accent);width:6px}
#onionPop .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.brl{display:flex;flex-direction:column;gap:3px}
.br{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;color:var(--text);cursor:pointer;font:inherit;text-align:left}
.br:hover{background:var(--panel2)}.br.sel{border-color:var(--accent);background:rgba(79,156,249,.12)}
.br .dot{width:26px;height:26px;flex:none;display:grid;place-items:center}.br .dot i{display:block;border-radius:50%;background:var(--text)}
.br .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br small{color:var(--muted)}
#nodePanel{position:absolute;left:0;right:0;bottom:0;height:58%;z-index:8;background:#1a1d22;border-top:2px solid var(--accent);display:flex;flex-direction:column}
#nodePanel.max{height:100%}
#nodePanel .nbar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;flex:none}
#nodePanel .nbody{flex:1;display:flex;min-height:0}
#nodeView{flex:1;position:relative;overflow:hidden;touch-action:none;background-color:#16191d;background-image:radial-gradient(#2b3039 1px,transparent 1px);cursor:grab}
#nodeWires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#nodeLayer{position:absolute;left:0;top:0;transform-origin:0 0}
.node{position:absolute;height:38px;border-radius:19px;background:#2a2f37;border:2px solid var(--nc,#4a5260);display:flex;align-items:center;gap:8px;padding:0 16px 0 5px;color:#eef0f3;font-size:12px;font-weight:600;cursor:move;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.node .nb{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;color:#fff;background:var(--nc,#4a5260)}
.node .nl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.node .plab{position:absolute;top:-24px;transform:translateX(-50%);font-size:9px;font-weight:500;color:var(--muted);white-space:nowrap;pointer-events:none}
#nodeLibCol{display:none;width:178px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px}
#nodePanel.lib #nodeLibCol{display:block}
#nodeLibCol h4{margin:10px 2px 4px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.libn{display:flex;align-items:center;gap:7px;width:100%;background:#2a2f37;border:1.5px solid var(--nc);border-radius:16px;padding:3px 10px 3px 3px;margin:3px 0;color:var(--text);cursor:grab;font:inherit;font-size:12px;text-align:left;touch-action:none}
.libn .nb{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--nc);color:#fff;font-size:12px;flex:none}
.node.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(79,156,249,.6),0 4px 14px rgba(0,0,0,.35)}
.node.off{opacity:.5}
.node .nh{height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:7px 7px 0 0;color:#fff;font-weight:600;cursor:move;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.node .nr{height:22px;display:flex;align-items:center;padding:0 12px;color:var(--muted);position:relative;white-space:nowrap}
.node .nr .t{overflow:hidden;text-overflow:ellipsis}
.node .nf{height:6px}
.pin,.pout{position:absolute;width:14px;height:14px;border-radius:50%;background:#1a1d22;border:2px solid #9fb3cc;cursor:crosshair;touch-action:none}
.pin{top:-9px;transform:translateX(-50%)}.pin.on{background:#9fb3cc}
.pout{bottom:-9px;left:50%;transform:translateX(-50%)}
.pin,.pout{width:16px;height:16px}
.node .pv{position:absolute;right:10px;top:-10px;font-size:10px;background:#f5a524;color:#111;border-radius:4px;padding:1px 4px;font-weight:700}
#nodeProps{width:250px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
#nodeProps label{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:12px}
#nodeProps .pr{display:flex;gap:6px;align-items:center}#nodeProps input[type=range]{flex:1;accent-color:var(--accent)}
#nodeProps input[type=number]{width:58px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px 4px;color:var(--text)}
#nodeProps input[type=text],#nodeProps select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;color:var(--text)}
#nodeProps .muted{color:var(--muted);font-size:12px}
@media (max-width:720px){#nodePanel{height:70%}#nodePanel .nbody{flex-direction:column}#nodeLibCol{width:auto;max-height:34%;border-right:0;border-bottom:1px solid var(--line)}#nodeProps{width:auto;max-height:42%;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:720px){#histPanel{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:60%}}
@media (max-width:720px){#palPanel{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:60%}}
@media (max-width:720px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr var(--tlh,200px);grid-template-areas:"top" "opts" "tools" "stage" "tl"}
  #tools{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:4px 6px}
  .tlL{width:128px}
  #status{display:none}
  #top .brand,#projName,#top .tb[data-a=newProject],#top .tb[data-a=openProject],#top .tb[data-a=saveProject],#top [data-a=exportMenu],#top .sep{display:none}
  .mb{padding:6px 5px}
  .tb{width:28px}.tb.wide{padding:0 5px}.tb .tbl{display:none}
  #top{gap:2px;padding:6px 4px}
  #toast{bottom:calc(var(--tlh,200px) + 16px)}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="brand">Celwerx</span>
    <button class="mb" data-menu="file">File</button><button class="mb" data-menu="edit">Edit</button><button class="mb" data-menu="view">View</button><button class="mb" data-menu="timeline">Timeline</button><button class="mb" data-menu="layer">Layer</button><button class="mb" data-menu="help">Help</button>
    <span class="sep"></span>
    <input id="projName" value="Untitled" aria-label="Project name">
    <span class="sep"></span>
    <button class="tb" data-a="newProject" title="New project" aria-label="New project"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M12 11v6M9 14h6"/></svg></button>
    <button class="tb" data-a="openProject" title="Open (Ctrl+O)" aria-label="Open"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="tb" data-a="saveProject" title="Save (Ctrl+S)" aria-label="Save"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg></button>
    <span class="sep"></span>
    <button class="tb" id="undoBtn" data-a="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tb" id="redoBtn" data-a="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="tb wide" id="nodeBtn" data-a="toggleNodes" title="Node editor (G)" aria-label="Node editor"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="7" height="6" rx="1.5"/><rect x="14.5" y="14" width="7" height="6" rx="1.5"/><rect x="2.5" y="14" width="7" height="6" rx="1.5"/><path d="M9.5 7c4 0 2 10 5 10M9.5 17h5"/></svg><span class="tbl">Nodes</span></button>
    <button class="tb" id="histBtn" data-a="toggleHistory" title="History" aria-label="History"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
    <span class="sep"></span>
    <button class="btn primary" data-a="exportMenu">Export</button>
    <span id="status"></span>
  </div>
  <div id="opts">
    <label>Color <input type="color" id="color" value="#1b1b1f"></label>
    <div class="sw" id="swatches"></div>
    <button class="btn" id="palBtn" data-a="togglePalette" title="Open the palette: add, rename, delete, import and export swatches">Palette</button>
    <label id="optSize">Size <input type="range" id="size" min="1" max="200"><input class="num" id="sizeNum" type="number" min="1" max="200"></label>
    <label id="optSmooth">Smoothing <input type="range" id="smooth" min="0" max="90"></label>
    <label id="optTol" class="hide">Tolerance <input type="range" id="tol" min="0" max="120"></label>
    <span id="optWarp" class="hide" style="display:flex;gap:10px;align-items:center">
      <span class="muted" style="color:var(--muted)">Drag any of the 16 points. Drag inside to move the whole envelope.</span>
      <button class="btn" data-a="warpReset" title="Put the envelope back to its starting shape">Reset envelope</button>
      <button class="btn" data-a="warpRefit" title="Start a fresh envelope around the drawing as it is now">New envelope</button>
    </span>
    <span id="optPts" class="hide" style="display:flex;gap:10px;align-items:center">
      <label>Falloff <input type="range" id="peFall" min="0" max="200"></label>
      <button class="btn" data-a="peDelete" title="Delete the selected point (Delete)">Delete point</button>
      <button class="btn" data-a="peSmooth" title="Smooth the whole line">Smooth line</button>
    </span>
    <span id="optCut" class="hide" style="display:flex;gap:10px;align-items:center">
      <button class="btn" data-a="cutNewLayer" title="Move the selected or cut artwork onto its own new layer">To new layer</button>
      <button class="btn" data-a="cutDelete">Delete</button>
    </span>
    <span id="optCam" class="hide" style="display:flex;gap:12px;align-items:center">
      <label>Cam zoom <input type="range" id="camZ" min="100" max="800"><input class="num" id="camZNum" type="number" min="100" max="800"></label>
      <label>Rotate <input type="range" id="camR" min="-180" max="180"><input class="num" id="camRNum" type="number" min="-180" max="180"></label>
      <label>Ease <select id="camE" style="background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:2px"><option value="linear">Linear</option><option value="ease">Ease in/out</option></select></label>
      <button class="btn" data-a="camDelKey">Delete key</button>
      <button class="btn" data-a="camReset">Reset camera</button>
    </span>
    <span id="optRig" class="hide" style="display:flex;gap:10px;align-items:center">
      <span class="seg"><button class="btn" id="rigBuild" data-a="rigBuild" title="Draw and adjust the skeleton">Build</button><button class="btn" id="rigPose" data-a="rigPose" title="Pose bones and set keys">Pose</button></span>
      <input type="text" id="boneName" placeholder="No bone selected" style="width:110px" aria-label="Bone name">
      <label>Parent <select id="boneParent"></select></label>
      <button class="btn" data-a="boneDelete">Delete bone</button>
      <span class="sep"></span>
      <label>Current layer <select id="layerBind"><option value="">Not rigged</option><option value="rigid">Follows selected bone</option><option value="deform">Bends with selected bones</option></select></label>
      <span class="sep"></span>
      <label>Ease <select id="boneE"><option value="linear">Linear</option><option value="ease">Ease in/out</option></select></label>
      <button class="btn" data-a="boneDelKey">Delete key</button>
      <span class="sep"></span>
      <button class="btn" id="ikBtn" data-a="toggleIK" title="Drag a bone tip and the bones above it follow (inverse kinematics)">IK</button>
      <select id="ikLen" title="How many bones IK moves"><option value="2">2 bones</option><option value="3">3 bones</option><option value="4">4 bones</option></select>
      <label>Stretch <input type="range" id="boneSx" min="20" max="300"></label>
      <label>Width <input type="range" id="boneSy" min="20" max="300"></label>
      <span class="sep"></span>
      <button class="btn" id="paintBtn" data-a="togglePaint" title="Paint how strongly the selected bone bends the current layer">Paint weights</button>
      <span id="paintOpts" class="hide" style="display:flex;gap:8px;align-items:center"><span class="seg"><button class="btn" id="wAdd" data-a="wAdd">Add</button><button class="btn" id="wSub" data-a="wSub">Remove</button></span><label>Radius <input type="range" id="wRad" min="10" max="250"></label></span>
    </span>
    <span class="sep"></span>
    <label>Layer opacity <input type="range" id="lop" min="0" max="100"></label>
    <label>Paper <input type="color" id="paper" value="#ffffff"></label>
  </div>
  <div id="tools"></div>
  <div id="stageBox">
  <div id="area">
    <div id="wrap"><canvas id="stage"></canvas><canvas id="ov"></canvas></div>
  </div>
    <div id="zoomBox"><button data-a="zoomOut" title="Zoom out">−</button><span id="zoomLbl">100%</span><button data-a="zoomIn" title="Zoom in">+</button><button data-a="fit" title="Fit (0)">Fit</button></div>
  </div>
  <div id="timeline">
    <div id="tlResize" title="Drag to resize"></div>
    <div id="tlBar">
      <button class="btn zbtn" data-a="tlZoomOut" title="Zoom the timeline out (1 with the mouse over the timeline; Ctrl+scroll also zooms)" aria-label="Zoom timeline out">−</button><button class="btn zbtn" data-a="tlZoomIn" title="Zoom the timeline in (2 with the mouse over the timeline)" aria-label="Zoom timeline in">+</button><button class="btn zbtn" data-a="tlFit" title="Fit every frame in the timeline">Fit</button>
      <span class="sep"></span>
      <button class="btn" data-a="first" title="First frame">|◀</button>
      <button class="btn" data-a="prev" title="Previous frame ( , )">◀</button>
      <button class="btn" id="playBtn" data-a="togglePlay" title="Play / pause (Enter)">▶ Play</button>
      <button class="btn" data-a="next" title="Next frame ( . )">▶</button>
      <button class="btn" data-a="last" title="Last frame">▶|</button>
      <span id="fLbl">1 / 24</span>
      <label>FPS <input class="num" id="fps" type="number" min="1" max="60"></label>
      <button class="btn" id="loopBtn" data-a="toggleLoop">Loop</button>
      <span class="sep"></span>
      <button class="btn" id="onionBtn" data-a="toggleOnion" title="Onion skin (O)">Onion</button>
      <button class="btn" id="onionRangeBtn" data-a="onionPanel" title="Choose which frames the onion skin shows">Range ▾</button>
      <button class="btn" id="camViewBtn" data-a="toggleCamView" title="Look through the camera (V)">Camera view</button>
      <button class="btn" id="restBtn" data-a="toggleRest" title="Show rigged layers unposed (P)">Rest pose</button>
      <span class="sep"></span>
      <button class="btn" data-a="newDrawing" title="New blank drawing on this frame (N)">New drawing</button>
      <button class="btn" data-a="duplicate" title="Copy the drawing into a new one on this frame (D)">Duplicate</button>
      <button class="btn" data-a="hold" title="Hold the previous drawing on this frame, then step forward (H)">Hold</button>
      <button class="btn" data-a="clear" title="Empty this cell (Delete)">Clear cell</button>
      <button class="btn" data-a="swapPanel" title="Swap this exposure for another drawing of the layer (S)">Swap</button>
      <span class="sep"></span>
      <button class="btn" data-a="insertFrame" title="Insert a frame after this one">+ Frame</button>
      <button class="btn" data-a="deleteFrame" title="Delete this frame on all layers">− Frame</button>
      <label>Length <input class="num" id="frames" type="number" min="1" max="2000"></label>
    </div>
    <div id="tlGrid"></div>
  </div>
</div>
<div id="toast"></div>
<input type="file" id="fileProject" accept=".json,application/json" class="hide">
<input type="file" id="fileImage" accept="image/*" class="hide">
<input type="file" id="filePalette" accept=".json,application/json" class="hide">
<input type="file" id="fileAudio" accept="audio/*,.mp3,.wav,.m4a,.ogg,.aac" class="hide">

<script>
'use strict';
const $=s=>document.querySelector(s);
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const ICON={
  brush:'<svg viewBox="0 0 24 24"><path d="M9.5 14.5 19 5a1.6 1.6 0 0 1 2.3 2.3l-9.5 9.5"/><path d="M9.5 14.5c-2-.3-3.6 1-3.8 3-.2 1.6-1 2.5-2.7 2.8 3.5 1.5 8 .8 8.8-3.3"/></svg>',
  eraser:'<svg viewBox="0 0 24 24"><path d="M15 4l5 5-9.5 9.5H6L3 15.5z"/><path d="M9 10l5 5M11 20h9"/></svg>',
  fill:'<svg viewBox="0 0 24 24"><path d="M4 11l7-7 8 8-7 7z"/><path d="M4 11h15"/><path d="M20 15.5s1.8 2.2 1.8 3.4a1.8 1.8 0 0 1-3.6 0c0-1.2 1.8-3.4 1.8-3.4z"/></svg>',
  line:'<svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg>',
  rect:'<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>',
  ellipse:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg>',
  picker:'<svg viewBox="0 0 24 24"><path d="M14.5 6.5l3 3L8 19H5v-3z"/><path d="M13 5l6 6M16 4.5a2.1 2.1 0 0 1 3 0l.5.5a2.1 2.1 0 0 1 0 3"/></svg>',
  hand:'<svg viewBox="0 0 24 24"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V4.5a1.5 1.5 0 0 1 3 0v6"/><path d="M14 10.5v-4a1.5 1.5 0 0 1 3 0v7.5c0 4-2.7 6.5-6 6.5-2.4 0-4-1.2-5.6-3.6L4 14.6a1.5 1.5 0 0 1 2.5-1.6L8 15"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  camera:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10.5l5-3v9l-5-3"/></svg>',
  speaker:'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',
  bone:'<svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><path d="M7.8 16.2 12 9l3 3z"/><circle cx="13.5" cy="10.5" r="1.6"/><path d="M14.8 9.2 19 5"/><circle cx="19.5" cy="4.5" r="1.5"/></svg>',
  note:'<svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>'
};
ICON.rig=ICON.bone;ICON.warp='<svg viewBox="0 0 24 24"><path d="M4 5c5 2 11-2 16 0M4 12c5 3 11-3 16 0M4 19c5 2 11-2 16 0M5 4c-1 5 2 11 0 16M12 4c2 5-2 11 0 16M19 4c-2 5 2 11 0 16"/></svg>';ICON.points='<svg viewBox="0 0 24 24"><path d="M4 18C7 6 13 20 20 6"/><rect x="2.5" y="16.5" width="3" height="3"/><rect x="10.5" y="11" width="3" height="3"/><rect x="18.5" y="4.5" width="3" height="3"/></svg>';ICON.cutter='<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1 20 19M8.1 15.9 20 5"/></svg>';ICON.select='<svg viewBox="0 0 24 24"><path d="M5 3l13 8.5-6 1.4L9.2 19z"/></svg>';
const TOOLS=[['select','Select and transform lines (A)'],['points','Edit points (Q)'],['cutter','Cutter (X)'],['warp','Envelope warp (W)'],['brush','Brush (B)'],['eraser','Eraser (E)'],['fill','Paint bucket (F)'],['line','Line (L)'],['rect','Rectangle (R)'],['ellipse','Ellipse (C)'],['picker','Color picker (I)'],['camera','Camera (K)'],['rig','Bones (J)'],['hand','Pan (hold Space)']];
const PAL_NAMES=['Black','White','Gray','Red','Orange','Yellow','Green','Teal','Blue','Indigo','Purple','Pink','Brown','Skin'];
const PALETTE=['#1b1b1f','#ffffff','#8a8f98','#e5484d','#f76b15','#ffc53d','#30a46c','#12a594','#0090ff','#3e63dd','#8e4ec6','#d6409f','#ad7f58','#f5d0b5'];

// ---------- State ----------
const S={W:960,H:540,fps:12,frames:24,frame:0,layer:0,layers:[],paper:'#ffffff',tool:'brush',color:'#1b1b1f',
  histOpen:false,clip:null,graph:null,graphDisplay:null,nodeLib:window.innerWidth>720,nodeOpen:false,nodeMax:false,graphSel:null,graphPreview:false,palette:null,swSel:null,palRecolor:true,palOpen:false,sizes:{brush:4,eraser:24,line:4,rect:4,ellipse:4,select:4},vsel:null,pedit:null,peFall:0,bfloat:null,smooth:0.35,tol:40,cellW:24,onion:true,onionW:{b:[0.8,0.5,0.25,0,0,0,0,0,0,0],a:[0.6,0,0,0,0,0,0,0,0,0]},brSel:null,loop:true,playing:false,zoom:1,
  cam:{keys:{}},camView:false,rig:{bones:{},keys:{},nextBone:1},restPose:false,ik:false,ikLen:2,rigPaint:false,wErase:false,wRad:60,autoBend:true,jointMode:null,camEase:'ease',audio:null,scrubSound:true};
let D={}, V={}, meta={}, urlCache={}, nextId=1, layerSeq=1;
let undoStack=[], redoStack=[];
const stage=$('#stage'), ov=$('#ov'), area=$('#area'), wrap=$('#wrap'), grid=$('#tlGrid');
let sctx, octx, scratch, tintC, sceneC, deformC;

function mkCanvas(w=S.W,h=S.H){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function newLayer(name,kind){return {kind:kind||'vector',id:layerSeq++,name:name||('Layer '+(layerSeq-1)),visible:true,opacity:1,locked:false,counter:0,bind:null,lib:[],cells:new Array(S.frames).fill(null)};}
function newDrawing(L,src,srcId){const id=nextId++;const c=mkCanvas();if(src)c.getContext('2d').drawImage(src,0,0);D[id]=c;
  if(srcId&&V[srcId])V[id]={items:V[srcId].items.slice()};else if(!src&&L.kind==='vector')V[id]={items:[]};(L.lib||(L.lib=[])).push(id);L.counter=(L.counter||0)+1;meta[id]={label:L.counter};return id;}
const curL=()=>S.layers[S.layer];
const size=()=>S.sizes[S.tool]||4;

// ---------- Undo ----------
function snapStruct(){return {frames:S.frames,layer:S.layer,graph:S.graph?JSON.parse(JSON.stringify(S.graph)):null,palette:JSON.parse(JSON.stringify(S.palette)),cam:JSON.parse(JSON.stringify(S.cam.keys)),rig:JSON.parse(JSON.stringify(S.rig)),layers:S.layers.map(l=>({...l,cells:l.cells.slice(),lib:(l.lib||[]).slice()}))};}
function restoreStruct(s){
  const now=new Map(S.layers.map(l=>[l.id,l]));
  S.frames=s.frames;if(s.cam)S.cam.keys=JSON.parse(JSON.stringify(s.cam));if(s.palette)S.palette=JSON.parse(JSON.stringify(s.palette));if(s.graph!==undefined)S.graph=s.graph?JSON.parse(JSON.stringify(s.graph)):null;
  if(s.rig){S.rig=JSON.parse(JSON.stringify(s.rig));if(rigSel&&!S.rig.bones[rigSel])rigSel=null;}rigVer++;rigStamp++;
  S.layers=s.layers.map(l=>{const c=now.get(l.id);const o={...l,cells:l.cells.slice(),lib:(l.lib||[]).slice()};if(c){o.name=c.name;o.visible=c.visible;o.opacity=c.opacity;o.locked=c.locked;}return o;});
  S.layer=clamp(s.layer,0,S.layers.length-1);
  if(S.frame>=S.frames)S.frame=S.frames-1;
}
function pushUndo(en){en.label=en.label||pendingLabel||toolLabel||inferLabel(en);en.t=Date.now();toolLabel=null;undoStack.push(en);if(undoStack.length>80)undoStack.shift();redoStack.length=0;updateUndoBtns();scheduleSave();}
function applyEntry(en,which){
  if(en.vecs)en.vecs.forEach(v=>{const vd=V[v.id];if(vd){vd.items=v[which];rasterV(v.id);}});
  if(en.vec){const vd=V[en.vec.id];if(vd){vd.items=en.vec[which];rasterV(en.vec.id);}S.vsel=null;}
  if(en.pix){const c=D[en.pix.id];if(c){c.getContext('2d').putImageData(en.pix[which],en.pix.x,en.pix.y);dirty(en.pix.id);}}
  if(en.struct)restoreStruct(en.struct[which]);
}
function undo(){if(act)return;S.warp=null;if(S.bfloat)commitFloat();if(!undoStack.length)return;S.pedit=null;const en=undoStack.pop();applyEntry(en,'before');redoStack.push(en);refreshAll();}
function redo(){if(act)return;S.warp=null;if(S.bfloat)commitFloat();if(!redoStack.length)return;S.pedit=null;const en=redoStack.pop();applyEntry(en,'after');undoStack.push(en);refreshAll();}
function updateUndoBtns(){$('#undoBtn').disabled=!undoStack.length;$('#redoBtn').disabled=!redoStack.length;$('#undoBtn').title=undoStack.length?`Undo ${undoStack[undoStack.length-1].label} (${KS('Mod+Z')})`:'Nothing to undo';$('#redoBtn').title=redoStack.length?`Redo ${redoStack[redoStack.length-1].label} (${KS('Mod+Shift+Z')})`:'Nothing to redo';renderHistory();}
let pendingLabel=null,toolLabel=null;
function setPending(l){pendingLabel=l||null;setTimeout(()=>{pendingLabel=null;},0);}
function inferLabel(en){return en.vecs?'Recolor swatch':en.vec?'Edit drawing':en.pix?'Paint':'Change';}
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||'');
const KS=k=>k.replace('Mod+',isMac?'⌘':'Ctrl+').replace('Shift+',isMac?'⇧':'Shift+');
function structAction(fn,label){const before=snapStruct();fn();pushUndo({label,struct:{before,after:snapStruct()}});refreshAll();}

// ---------- Rendering ----------
let rq=false;
function requestRender(){if(!rq){rq=true;requestAnimationFrame(()=>{rq=false;
  renderFrame(sctx,S.frame,{onion:S.onion&&!S.playing,camera:S.camView,rest:effRest(),scale:dispK,view:S.nodeOpen&&S.graphPreview&&S.graphSel?S.graphSel:(S.graphDisplay&&S.graph&&S.graph.nodes.some(n=>n.id===S.graphDisplay)?S.graphDisplay:null)});
  sctx.setTransform(dispK,0,0,dispK,0,0);
  if(S.tool==='select'&&!S.playing)drawSelection(sctx);
  if(S.tool==='points'&&!S.playing)drawPoints(sctx);
  if(S.tool==='warp'&&!S.playing)drawWarp(sctx);
  if(S.bfloat)drawFloat(sctx);
  if(!S.camView&&!S.playing&&(S.tool==='camera'||camHasKeys()))drawCamFrame(sctx,camAt(S.frame));
  if(S.tool==='rig'&&!S.playing){if(S.rigPaint)drawWeights(sctx);if(!S.jointMode)drawBones(sctx);}
  if(S.jointMode)drawJoints(sctx);});}}
// ---------- Camera ----------
const camDefault=()=>({x:S.W/2,y:S.H/2,z:1,r:0});
const camHasKeys=()=>Object.keys(S.cam.keys).length>0;
function camKeyFrames(){return Object.keys(S.cam.keys).map(Number).sort((a,b)=>a-b);}
function camAt(f){
  const ks=camKeyFrames();if(!ks.length)return camDefault();

window.addEventListener('pointermove',e=>{

  const p=toStage(e,!paint);ovPrep();if(paint){octx.setTransform(dispK,0,0,dispK,0,0);if(S.camView)applyCam(octx,camAt(S.frame));}
  octx.lineWidth=Math.max(1,1/S.zoom);octx.strokeStyle='rgba(0,0,0,.6)';octx.beginPath();octx.arc(p.x,p.y,Math.max(1,paint?S.wRad:size()/2),0,Math.PI*2);octx.stroke();

function beginTool(e){

  if(t==='points'){peBegin(e);return;}
  if(t==='cutter'){cutBegin(e);return;}
  if(t==='warp'){warpBegin(e);return;}

  if(t==='rig'){rigBegin(e,p);return;}
  if(t==='camera'){act={pid:e.pointerId,t,before:snapStruct(),r0:rawStage(e),c0:camAt(S.frame)};try{area.setPointerCapture(e.pointerId);}catch(_){}return;}

  if(!L.visible){toast('This layer is hidden');return;}
  if(t==='eraser'&&!L.cells[S.frame]){toast('Nothing to erase on this cell');return;}
  if(L.bind&&L.bind.mode==='deform'&&!effRest()&&!deformIsRest(L,S.frame)){toast('This layer bends with bones. Turn on Rest pose (P) to draw on it.');return;}

    try{area.setPointerCapture(e.pointerId);}catch(_){}

  }

function grow(x0,y0,x1,y1){const b=act.box;if(!b)act.box=[x0,y0,x1,y1];else{b[0]=Math.min(b[0],x0);b[1]=Math.min(b[1],y0);b[2]=Math.max(b[2],x1);b[3]=Math.max(b[3],y1);}}

function moveTool(e){
  if(act.t==='select'){selMove(e);return;}
  if(act.t==='pedit'){peMove(e);return;}
  if(act.t==='cutter'){cutMove(e);return;}
  if(act.t==='warp'){warpMove(e);return;}
  if(act.t==='rig'){rigMove(e);return;}
  if(act.t==='camera'){const q=rawStage(e),c0=act.c0;let dx=q.x-act.r0.x,dy=q.y-act.r0.y;
    if(S.camView){const a=c0.r*Math.PI/180,co=Math.cos(a),si=Math.sin(a);const sx=(dx*co-dy*si)/c0.z,sy=(dx*si+dy*co)/c0.z;setCamKey(S.frame,{x:c0.x-sx,y:c0.y-sy});}
    else setCamKey(S.frame,{x:c0.x+dx,y:c0.y+dy});
    act.moved=true;syncCamUI();requestRender();return;}
  let evs=e.getCoalescedEvents?e.getCoalescedEvents():null;if(!evs||!evs.length)evs=[e];
  for(const ev of evs){const p=toStage(ev);
    if(act.t==='brush'||act.t==='eraser'){const k=1-S.smooth;act.sm.x+=(p.x-act.sm.x)*k;act.sm.y+=(p.y-act.sm.y)*k;const np={x:act.sm.x,y:act.sm.y,p:p.p};
      if(act.vec){if(act.t==='brush')act.vpts.push([np.x,np.y,np.p]);else eraseAt(act.last,np);}else seg(act.last,np);act.last=np;act.raw=p;}
    else act.cur=p;}
  if(act.vec&&act.t==='brush')previewVec();
  if(act.t==='line'||act.t==='rect'||act.t==='ellipse'){ovPrep();drawShape(octx,act.start,act.cur,act.t);}
  requestRender();

function drawShape(x,a,b,t){
  x.save();x.lineCap='round';x.lineJoin='round';x.strokeStyle=S.color;x.lineWidth=size();x.beginPath();
  if(t==='line'){x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);}
  else if(t==='rect'){x.rect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y));}
  else{x.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.max(0.5,Math.abs(b.x-a.x)/2),Math.max(0.5,Math.abs(b.y-a.y)/2),0,0,Math.PI*2);}

function endTool(){
  if(act.t==='select'){selEnd();return;}
  if(act.t==='pedit'){peEnd();return;}
  if(act.t==='cutter'){cutEnd();return;}
  if(act.t==='warp'){warpEnd();return;}
  if(act.vec){const a=act,vd=V[a.id];
    if(a.t==='brush'){if(a.raw)a.vpts.push([a.raw.x,a.raw.y,a.raw.p]);vd.items=[...vd.items,makeStroke(a.vpts,size(),S.color)];}
    else if(a.t==='eraser'){if(a.raw)eraseAt(a.last,a.raw);}
    else if(a.t==='line'||a.t==='rect'||a.t==='ellipse'){const d=Math.hypot(a.cur.x-a.start.x,a.cur.y-a.start.y);if(d>1)vd.items=[...vd.items,shapeStroke(a.start,a.cur,a.t)];}
    finishVec();return;}
  if(act.t==='rig'){rigEnd();return;}
  if(act.t==='camera'){const a=act;act=null;if(a.moved){pushUndo({struct:{before:a.before,after:snapStruct()}});buildTimeline();}else setCamKeyIfNone(a.before);return;}
  if(act.t==='brush'||act.t==='eraser'){if(act.raw&&(act.raw.x!==act.last.x||act.raw.y!==act.last.y))seg(act.last,act.raw);}
  else if(act.t==='line'||act.t==='rect'||act.t==='ellipse'){ovClear();const a=act.start,b=act.cur;drawShape(act.ctx,a,b,act.t);const r=size();grow(Math.min(a.x,b.x)-r,Math.min(a.y,b.y)-r,Math.max(a.x,b.x)+r,Math.max(a.y,b.y)+r);}
  finishPix();
}
function finishPix(){
  const a=act;act=null;if(!a)return;
  if(!a.box){if(a.before){restoreStruct(a.before);buildTimeline();}requestRender();return;}
  const x0=clamp(Math.floor(a.box[0])-2,0,S.W),y0=clamp(Math.floor(a.box[1])-2,0,S.H),x1=clamp(Math.ceil(a.box[2])+2,0,S.W),y1=clamp(Math.ceil(a.box[3])+2,0,S.H);
  if(x1<=x0||y1<=y0){if(a.before){restoreStruct(a.before);buildTimeline();}requestRender();return;}
  const before=scratch.getContext('2d').getImageData(x0,y0,x1-x0,y1-y0);const after=a.ctx.getImageData(x0,y0,x1-x0,y1-y0);

  requestRender();

function abortStroke(){

function rigBegin(e,p){

// ---------- Auto-rig ----------
function collectParts(){
  const parts=[];const G=4;
  S.layers.forEach(L=>{const id=L.cells[S.frame];if(!id||!L.visible||!D[id])return;
    const c=D[id],cw=Math.ceil(S.W/G),ch=Math.ceil(S.H/G);const d=c.getContext('2d').getImageData(0,0,S.W,S.H).data;const m=new Uint8Array(cw*ch);let n=0,sx=0,sy=0;

    if(n>3)parts.push({L,m,cw,ch,n,cx:sx/n,cy:sy/n});});
  return parts;
}
async function autoRig(){

    <button class="btn" data-v="parts" ${parts.length<2?'disabled':''}>Separate parts<small>${parts.length<2?'Needs two or more visible layers with drawings on this frame.':`Uses the ${parts.length} visible layers on frame ${S.frame+1}. Each layer gets a bone named after it, joined where the parts overlap or come closest. The root is a layer named body, torso, chest, hips or pelvis, or else the largest part.`}</small></button>
    <button class="btn" data-v="joints" ${hasDrawing?'':'disabled'}>One drawing: tap the joints<small>${hasDrawing?`Rigs the drawing on ${esc(L.name)}. You tap the joints, and the drawing bends at each one.`:'Select a layer that has a drawing on this frame.'}</small></button></div>
    <label style="display:flex;gap:8px;align-items:flex-start;margin-top:14px;color:var(--text)"><input type="checkbox" id="arBend" ${S.autoBend===false?'':'checked'} style="margin-top:2px">
      <span>Parts bend at the joints (Bends with selected bones). For separate parts, the root part stays rigid. Turn this off for stiff cut-out parts.</span></label>

function buildPartsRig(parts,bend){

    for(let k=0;k<A.m.length;k++)if(A.m[k]&&B.m[k]){ov++;ox+=(k%A.cw)*G+G/2;oy+=((k/A.cw)|0)*G+G/2;}

// ---------- Sound ----------
let actx=null, liveSrc=null;
function AC(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}if(actx.state==='suspended')actx.resume();return actx;}
function soundSource(f,dest,dur){
  const a=S.audio;if(!a||!a.buf)return null;const ctx=AC();if(!ctx)return null;
  const off=(f-a.start)/S.fps;if(off>=a.buf.duration)return null;if(dur&&off<0&&-off>=dur)return null;
  const src=ctx.createBufferSource();src.buffer=a.buf;const g=ctx.createGain();g.gain.value=a.vol;src.connect(g);g.connect(dest||ctx.destination);
  const now=ctx.currentTime+0.02;

  else{if(dur)src.start(now-off,0,dur+off);else src.start(now-off,0);}
  return src;
}
function soundStop(){if(liveSrc){try{liveSrc.stop();}catch(_){}liveSrc=null;}}
function soundPlayFrom(f){soundStop();if(S.audio&&!S.audio.mute)liveSrc=soundSource(f);}
function scrubSound(){if(!S.audio||S.audio.mute||!S.scrubSound||S.playing)return;soundStop();liveSrc=soundSource(S.frame,null,Math.max(1/S.fps,0.06));}
function drawWave(box){
  const a=S.audio;if(!a||!a.buf)return;const cw=S.cellW,total=S.frames*cw,CH=8000;
  const c0=a.buf.getChannelData(0),c1=a.buf.numberOfChannels>1?a.buf.getChannelData(1):null,sr=a.buf.sampleRate,spp=sr/S.fps/cw;
  for(let x0=0;x0<total;x0+=CH){
    const w=Math.min(CH,total-x0);const c=document.createElement('canvas');c.width=w;c.height=30;c.style.left=x0+'px';c.style.width=w+'px';
    const g=c.getContext('2d');g.fillStyle=a.mute?'#5b6470':'#2fb8a8';
    for(let px=0;px<w;px++){const gx=x0+px;const s0=Math.floor((gx/cw-a.start)*sr/S.fps);if(s0<0||s0>=c0.length)continue;
      const s1=Math.min(c0.length,s0+Math.max(1,Math.ceil(spp)));const st=Math.max(1,Math.floor((s1-s0)/64));let m=0;
      for(let i=s0;i<s1;i+=st){const v=Math.abs(c1?(c0[i]+c1[i])/2:c0[i]);if(v>m)m=v;}
      const h=Math.max(1,Math.min(28,m*28*Math.max(a.vol,0.25)));g.fillRect(px,15-h/2,1,h);}
    g.fillStyle='rgba(255,255,255,.07)';for(let fx=(cw-(x0%cw))%cw;fx<w;fx+=cw)g.fillRect(fx,0,1,30);

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function b64(bytes){let out='';for(let i=0;i<bytes.length;i+=0x8000)out+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(out);}

$('#fileAudio').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const bytes=new Uint8Array(await f.arrayBuffer());const old=S.audio;
    await setAudio({name:f.name,mime:f.type||'',bytes,start:old?old.start:0,vol:old?old.vol:1,mute:false});

// ---------- Camera UI ----------

function tidyGraph(silent){
  const G=S.graph;const out=new Map();G.links.forEach(l=>{if(!out.has(l.from))out.set(l.from,[]);out.get(l.from).push(l.to);});
  const depth=new Map();const dfs=(id,seen=new Set())=>{if(depth.has(id))return depth.get(id);if(seen.has(id))return 0;seen.add(id);const kids=out.get(id)||[];
    const d=kids.length?1+Math.max(...kids.map(k=>dfs(k,seen))):0;depth.set(id,d);return d;};G.nodes.forEach(n=>dfs(n.id));
  const maxD=Math.max(0,...depth.values());const rows={};G.nodes.forEach(n=>{const r=maxD-(depth.get(n.id)||0);(rows[r]=rows[r]||[]).push(n);});
  const apply=()=>{Object.keys(rows).sort((a,b)=>a-b).forEach(r=>{const ns=rows[r].sort((a,b)=>a.x-b.x);let x=-(ns.reduce((s,n)=>s+nodeW(n)+30,0)-30)/2;ns.forEach(n=>{n.x=Math.round(x);n.y=+r*110+30;x+=nodeW(n)+30;});});};

function bindNodeView(){
  const v=$('#nodeView');let drag=null;const ptrs=new Map();
  v.addEventListener('pointerdown',e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){const p=[...ptrs.values()];drag={mode:'pinch',d0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1,z0:NV.z,x0:NV.x,y0:NV.y,mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2};return;}
    if(e.button===2)return;const t=e.target;v.setPointerCapture(e.pointerId);
    if(t.classList.contains('pout')){const n=nodeById(+t.dataset.node);drag={mode:'wire',from:n.id,a:portPos(n,'out')};return;}
    if(t.classList.contains('pin')){const id=+t.dataset.node,port=t.dataset.port;const l=S.graph.links.find(l=>l.to===id&&l.port===port);
      if(l){const before=snapStruct();S.graph.links=S.graph.links.filter(x=>x!==l);const a=nodeById(l.from);drag={mode:'wire',from:a.id,a:portPos(a,'out'),detached:{before,label:'Disconnect'}};renderNodes();return;}}
    const nd=t.closest('.node');
    if(nd){const id=+nd.dataset.node;if(S.graphSel!==id){S.graphSel=id;renderNodes();if(S.graphPreview)requestRender();}const n=nodeById(id);const p=viewPt(e);drag={mode:'move',id,ox:p.x-n.x,oy:p.y-n.y,before:snapStruct(),moved:false};return;}
    drag={mode:'pan',x:e.clientX,y:e.clientY,nx:NV.x,ny:NV.y,moved:false};
  });
  v.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!drag)return;
    if(drag.mode==='pinch'){const p=[...ptrs.values()];if(p.length<2)return;const r=v.getBoundingClientRect();const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);NV.z=clamp(drag.z0*d/drag.d0,0.3,2.5);
      const mx=drag.mx-r.left,my=drag.my-r.top;NV.x=mx-(mx-drag.x0)*NV.z/drag.z0;NV.y=my-(my-drag.y0)*NV.z/drag.z0;renderNodes();return;}
    if(drag.mode==='pan'){NV.x=drag.nx+e.clientX-drag.x;NV.y=drag.ny+e.clientY-drag.y;drag.moved=true;$('#nodeLayer').style.transform=`translate(${NV.x}px,${NV.y}px) scale(${NV.z})`;drawWires();return;}
    if(drag.mode==='move'){const n=nodeById(drag.id),p=viewPt(e);n.x=Math.round(p.x-drag.ox);n.y=Math.round(p.y-drag.oy);drag.moved=true;const d=$(`.node[data-node="${n.id}"]`);if(d){d.style.left=n.x+'px';d.style.top=n.y+'px';}drawWires();return;}
    if(drag.mode==='wire'){drawWires({a:drag.a,b:viewPt(e)});}
  });
  const up=e=>{
    ptrs.delete(e.pointerId);const d=drag;if(!d)return;if(d.mode==='pinch'){if(ptrs.size<2)drag=null;return;}drag=null;
    if(d.mode==='move'&&d.moved){pushUndo({label:'Move node',struct:{before:d.before,after:snapStruct()}});scheduleSave();}
    if(d.mode==='pan'&&!d.moved){if(S.graphSel){S.graphSel=null;renderNodes();if(S.graphPreview)requestRender();}}
    if(d.mode==='wire'){const t=document.elementFromPoint(e.clientX,e.clientY);let done=false;
      const restore=()=>{if(d.detached){const after=snapStruct();pushUndo({label:'Disconnect',struct:{before:d.detached.before,after}});}};
      if(t&&t.classList&&t.classList.contains('pin')){const to=+t.dataset.node,port=t.dataset.port;
        if(d.detached){S.graph.links=S.graph.links.filter(l=>!(l.to===to&&l.port===port));if(to!==d.from&&!reaches(to,d.from)){S.graph.links.push({from:d.from,to,port});}else toast('That connection would make a loop');pushUndo({label:'Reconnect',struct:{before:d.detached.before,after:snapStruct()}});}
        else linkNodes(d.from,to,port);done=true;}
      else if(t&&t.closest&&t.closest('.node')){const to=+t.closest('.node').dataset.node,n=nodeById(to);const free=nodeIns(n).find(pt=>!S.graph.links.some(l=>l.to===to&&l.port===pt));
        if(free&&to!==d.from){if(d.detached){if(!reaches(to,d.from))S.graph.links.push({from:d.from,to,port:free});pushUndo({label:'Reconnect',struct:{before:d.detached.before,after:snapStruct()}});}else linkNodes(d.from,to,free);done=true;}}
      if(!done){restore();if(!d.detached&&t&&t.closest&&t.closest('#nodeView')){const p=viewPt(e);nodeAddMenu(e.clientX,e.clientY,p.x,p.y-15,d.from);}}
      renderNodes();requestRender();}
  };
  v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
  v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect();if(e.ctrlKey||e.metaKey)nodeZoom(Math.exp(-e.deltaY*0.01),e.clientX-r.left,e.clientY-r.top);else{NV.x-=e.deltaX;NV.y-=e.deltaY;renderNodes();}},{passive:false});
  v.addEventListener('dblclick',e=>{const nd=e.target.closest('.node');if(nd){S.graphSel=+nd.dataset.node;S.graphPreview=true;renderNodes();requestRender();}});
}

// right-click and long-press
function openContext(e){
  if(e.target&&e.target.closest&&e.target.closest('#nodePanel'))return nodeContext(e);
  const t=e.target,x=e.clientX,y=e.clientY;if(!t||!t.closest)return false;
  if(t.closest('#tlGrid')){
    const cell=t.closest('.c'),lrow=t.closest('.tlL'),snd=t.closest('#sndRow');
    if(snd||(lrow&&lrow.querySelector('[data-a="soundSettings"],[data-a="importSound"]'))){showMenu(soundMenu(),x,y);return true;}
    if(cell){if(S.playing)stop();const f=+cell.dataset.f;if(cell.dataset.i!=null&&+cell.dataset.i!==S.layer)setLayer(+cell.dataset.i);setFrame(f);
      if(cell.dataset.row==='cam'){showMenu(camMenu(),x,y);return true;}if(cell.dataset.row==='rig'){showMenu(boneMenu(),x,y);return true;}
      showMenu([...cellMenu(),'sep',...tlZoomItems()],x,y);return true;}
    if(lrow&&lrow.dataset.i!=null){const i=+lrow.dataset.i;if(i!==S.layer)setLayer(i);showMenu(layerMenu(i),x,y);return true;}
    if(lrow&&lrow.querySelector('[data-a="pickCamTool"]')){showMenu(camMenu(),x,y);return true;}
    if(lrow&&lrow.querySelector('[data-a="pickRigTool"]')){showMenu(boneMenu(),x,y);return true;}
    return false;}
  if(t.closest('#area')&&!t.closest('#zoomBox')){
    const L=curL(),id=L&&L.cells[S.frame];
    if(S.tool==='rig'&&!S.jointMode){const hit=boneHit(toStage(e,false),rigMode==='build'||S.restPose);if(hit){rigSel=hit.id;syncRigUI();buildTimeline();requestRender();showMenu(boneMenu(),x,y);return true;}}
    if(id&&V[id]&&(S.tool==='select'||S.tool==='points')){const p=toStage(e,true);const i=hitItem(V[id],p,8/viewScale());
      if(i>=0){const it=V[id].items[i];if(!(S.vsel&&S.vsel.id===id&&S.vsel.set.has(it))){S.vsel={id,set:new Set([it])};if(S.tool!=='select')setTool('select');requestRender();}}}
    showMenu(stageMenu(),x,y);return true;}
  return false;
}

// ---------- Playback ----------
let raf=0,lastT=0;
function play(){if(S.playing)return;if(S.bfloat)commitFloat();S.playing=true;if(S.frame>=S.frames-1)S.frame=0;
  let f0=S.frame,t0=performance.now();soundPlayFrom(f0);ovClear();syncUI();requestRender();
  const step=t=>{if(!S.playing)return;let f=f0+Math.floor((t-t0)*S.fps/1000);
    if(f>=S.frames){if(S.loop){f0=0;t0=t;f=0;soundPlayFrom(0);}else{setFrame(S.frames-1);stop();return;}}
    if(f!==S.frame)setFrame(f);raf=requestAnimationFrame(step);};
  raf=requestAnimationFrame(step);}
function stop(){soundStop();if(!S.playing)return;S.playing=false;cancelAnimationFrame(raf);syncUI();requestRender();}

// ---------- Keyboard ----------
let modalOpen=false;
window.addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input,select,textarea')){if(e.key==='Enter'||e.key==='Escape')e.target.blur();return;}
  if(modalOpen)return;
  if(S.jointMode){if(e.key==='Escape')jointCancel();else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();jointUndo();}else if(e.key==='Enter'){e.preventDefault();jointDone();}return;}
  const k=e.key,lk=k.length===1?k.toLowerCase():k,mod=e.ctrlKey||e.metaKey;
  if(menuEl&&k==='Escape'){closeMenu();return;}
  if(mod&&lk==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&lk==='c'){e.preventDefault();doCopy();return;}
  if(mod&&lk==='x'){e.preventDefault();doCut();return;}
  if(mod&&lk==='v'){e.preventDefault();doPaste();return;}
  if(mod&&lk==='o'){e.preventDefault();A.openProject();return;}
  if(mod&&lk==='s'&&e.shiftKey){e.preventDefault();saveAs();return;}
  if(!mod)setPending(({n:'New drawing',d:'Duplicate drawing',h:'Hold',Delete:'Delete',Backspace:'Delete',';':'Swap drawing',"'":'Swap drawing'})[lk]);
  if(mod&&lk==='y'){e.preventDefault();redo();return;}
  if(mod&&lk==='s'){e.preventDefault();saveProject();return;}
  if(mod&&lk==='a'&&S.tool==='select'){e.preventDefault();selectAll();return;}
  if(mod||e.altKey)return;
  const map={q:'points',x:'cutter',w:'warp',a:'select',b:'brush',e:'eraser',f:'fill',l:'line',r:'rect',c:'ellipse',i:'picker',k:'camera',j:'rig'};
  if(map[lk]){setTool(map[lk]);return;}
  switch(lk){
    case 'n':A.newDrawing();break; case 'd':A.duplicate();break; case 'h':A.hold();break;
    case 'Delete':case 'Backspace':e.preventDefault();if(S.nodeOpen&&overNodes&&S.graphSel){nodeDelete();break;}editDelete();break;
    case 'Escape':if(S.bfloat)commitFloat();if(S.vsel)S.vsel=null;if(S.pedit)S.pedit=null;requestRender();break;
    case ',':case 'ArrowLeft':e.preventDefault();A.prev();break;
    case '.':case 'ArrowRight':e.preventDefault();A.next();break;
    case 'ArrowUp':e.preventDefault();setLayer(S.layer-1);break;
    case 'ArrowDown':e.preventDefault();setLayer(S.layer+1);break;
    case 'Enter':e.preventDefault();A.togglePlay();break;
    case 'g':A.toggleNodes();break;
    case 'o':A.toggleOnion();break; case 's':swapPanel();break; case ';':cycleDrawing(-1);break; case "'":cycleDrawing(1);break; case 'v':A.toggleCamView();break; case 'p':A.toggleRest();break;
    case '[':S.sizes[S.tool]&&(S.sizes[S.tool]=clamp(Math.round(size()/1.2),1,200));syncUI();break;
    case ']':S.sizes[S.tool]&&(S.sizes[S.tool]=clamp(Math.round(size()*1.2)+1,1,200));syncUI();break;
    case ' ':e.preventDefault();if(!spaceDown){spaceDown=true;syncUI();}break;
    case '0':fit();break; case '=':case '+':zoomBy(1.25);break; case '-':zoomBy(0.8);break;
    case '1':if(overNodes&&S.nodeOpen)nodeZoom(0.8);else if(overTimeline)A.tlZoomOut();else zoomBy(0.8);break;
    case '2':if(overNodes&&S.nodeOpen)nodeZoom(1.25);else if(overTimeline)A.tlZoomIn();else zoomBy(1.25);break;
    case '?':help();break;
  }
});
window.addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;syncUI();}});

let toastT=0;

function modal(title,body,buttons,onOpen){
  return new Promise(res=>{modalOpen=true;const bg=el('div','modalBg');const m=el('div','modal');
    m.innerHTML=`<h2></h2><div class="body"></div><div class="actions"></div>`;m.querySelector('h2').textContent=title;m.querySelector('.body').innerHTML=body;
    const close=v=>{modalOpen=false;bg.remove();res({v,root:m});};
    (buttons||[{label:'Close',v:null}]).forEach(b=>{const x=el('button','btn'+(b.primary?' primary':''));x.textContent=b.label;x.onclick=()=>close(b.v);m.querySelector('.actions').append(x);});
    m.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>close(x.dataset.v));
    bg.addEventListener('pointerdown',e=>{if(e.target===bg)close(null);});
    bg.append(m);document.body.append(bg);if(onOpen)onOpen(m,close);
  });
}
