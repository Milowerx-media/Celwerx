  const drawings={};used.forEach(id=>{const label=meta[id]?meta[id].label:'';if(V[id]){drawings[id]={label,vec:V[id].items};return;}if(!urlCache[id])urlCache[id]=D[id].toDataURL('image/png');drawings[id]={label,png:urlCache[id]};});
  return {app:'cel-studio',version:2,name:$('#projName').value,W:S.W,H:S.H,fps:S.fps,frames:S.frames,paper:S.paper,layer:S.layer,cam:{keys:S.cam.keys},rig:S.rig,palette:S.palette,graph:S.graph?{next:S.graph.next,links:S.graph.links,nodes:S.graph.nodes.map(n=>n.type==='layer'?{...n,layer:S.layers.findIndex(l=>l.id===n.layer)}:n)}:null,onionW:S.onionW,onion:S.onion,scrubSound:S.scrubSound,audio:withAudio?audioJSON():null,
    layers:S.layers.map(L=>({name:L.name,visible:L.visible,opacity:L.opacity,locked:L.locked,kind:L.kind||'bitmap',counter:L.counter,bind:L.bind||null,lib:(L.lib||[]).filter(id=>used.has(id)),cells:L.cells})),drawings};
}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
async function loadProject(o){
  if(!o||o.app!=='cel-studio'||!Array.isArray(o.layers))throw new Error('Not a Celwerx project');
  stop();S.W=clamp(o.W|0,16,4096);S.H=clamp(o.H|0,16,4096);S.fps=o.fps||12;S.frames=Math.max(1,o.frames|0);S.paper=o.paper||'#ffffff';
  D={};V={};meta={};urlCache={};nextId=1;layerSeq=1;undoStack=[];redoStack=[];S.vsel=null;S.pedit=null;S.bfloat=null;
  const idMap={};
  for(const [old,dr] of Object.entries(o.drawings||{})){const id=nextId++;const c=mkCanvas();D[id]=c;meta[id]={label:dr.label};idMap[old]=id;
    if(Array.isArray(dr.vec)){V[id]={items:dr.vec};rasterV(id);}else{const img=await loadImg(dr.png);c.getContext('2d').drawImage(img,0,0);urlCache[id]=dr.png;}}
  S.layers=o.layers.map(l=>({kind:l.kind==='vector'?'vector':'bitmap',id:layerSeq++,name:l.name||'Layer',visible:l.visible!==false,opacity:l.opacity==null?1:l.opacity,locked:!!l.locked,counter:l.counter||0,bind:l.bind||null,lib:(l.lib||[]).map(x=>idMap[x]).filter(Boolean),
    cells:Array.from({length:S.frames},(_,f)=>(l.cells&&l.cells[f]!=null&&idMap[l.cells[f]])||null)}));
  S.layers.forEach(L=>L.cells.forEach(id=>{if(id&&!L.lib.includes(id))L.lib.push(id);}));
  if(!S.layers.length)S.layers=[newLayer()];
  S.layer=clamp(o.layer|0,0,S.layers.length-1);S.frame=0;$('#projName').value=o.name||'Untitled';
  S.graph=null;S.graphSel=null;S.graphPreview=false;
  if(o.graph&&Array.isArray(o.graph.nodes)&&Array.isArray(o.graph.links)){const nodes=o.graph.nodes.filter(n=>n&&NT[n.type]).map(n=>{const c={...n,params:{...nodeDefaults(n.type),...(n.params||{})}};
      if(n.type==='layer'){const L=S.layers[n.layer];c.layer=L?L.id:-1;}return c;}).filter(n=>n.type!=='layer'||n.layer>=0);const ids=new Set(nodes.map(n=>n.id));
    S.graph={nodes,links:o.graph.links.filter(l=>ids.has(l.from)&&ids.has(l.to)),next:Math.max(o.graph.next||1,...nodes.map(n=>n.id+1))};}
  if(o.onionW&&Array.isArray(o.onionW.b)&&Array.isArray(o.onionW.a)){const f=a=>Array.from({length:10},(_,i)=>clamp(+a[i]||0,0,1));S.onionW={b:f(o.onionW.b),a:f(o.onionW.a)};}if(o.onion===false)S.onion=false;
  S.palette=defaultPalette();if(o.palette&&Array.isArray(o.palette.swatches)){const sw=o.palette.swatches.filter(w=>w&&HEX.test(w.color));
    const br=o.palette.brushes?cleanBrushes(o.palette.brushes):defaultBrushes();S.palette={name:o.palette.name||'Palette',swatches:sw.map((w,i)=>({id:i+1,name:String(w.name||'Color'),color:w.color})),nextId:sw.length+1,brushes:br,brNext:br.length+1};}S.brSel=null;S.swSel=null;
  S.cam={keys:{}};if(o.cam&&o.cam.keys)for(const [k,v] of Object.entries(o.cam.keys)){const f=+k;if(f>=0&&f<S.frames&&v)S.cam.keys[f]={x:+v.x,y:+v.y,z:clamp(+v.z||1,1,8),r:+v.r||0,ease:v.ease==='linear'?'linear':'ease'};}
  S.camView=false;S.scrubSound=o.scrubSound!==false;soundStop();S.audio=null;
  S.rig={bones:{},keys:{},nextBone:1};S.restPose=false;rigSel=null;S.jointMode=null;showJointBar();
  if(o.rig&&o.rig.bones){S.rig.bones=o.rig.bones;S.rig.keys=o.rig.keys||{};S.rig.nextBone=o.rig.nextBone||(Math.max(0,...Object.keys(o.rig.bones).map(Number))+1);
    for(const id in S.rig.keys){for(const f in S.rig.keys[id])if(+f>=S.frames)delete S.rig.keys[id][f];}}
  rigVer++;rigStamp++;
  setupStage();fit();refreshAll();
  if(o.audio){try{await loadAudioJSON(o.audio);}catch(_){toast('The project opened, but its sound could not be decoded');}}else clearAudioLocal();
}
function freshProject(name,W,H,fps,frames,paper){
  stop();S.W=W;S.H=H;S.fps=fps;S.frames=frames;S.paper=paper;S.frame=0;
  D={};V={};meta={};urlCache={};nextId=1;layerSeq=1;undoStack=[];redoStack=[];S.vsel=null;S.pedit=null;S.bfloat=null;
  S.layers=[newLayer('Ink'),newLayer('Color')];S.layer=0;$('#projName').value=name||'Untitled';
  S.palette=defaultPalette();S.swSel=null;S.graph=null;S.graphSel=null;S.graphPreview=false;
  S.cam={keys:{}};S.camView=false;soundStop();S.audio=null;clearAudioLocal();
  S.rig={bones:{},keys:{},nextBone:1};S.restPose=false;rigSel=null;rigVer++;rigStamp++;S.jointMode=null;showJointBar();
  setupStage();fit();refreshAll();
}
async function saveProject(){try{const blob=new Blob([JSON.stringify(serialize(true))],{type:'application/json'});await saveFile(slug()+'.json',blob);}catch(e){toast('Could not build the project file');}}
$('#fileProject').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const o=JSON.parse(await f.text());await loadProject(o);toast('Opened '+f.name);}catch(err){toast('Could not open that file: '+err.message);}};
$('#fileImage').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const L=needEditable();if(!L)return;
  try{const url=URL.createObjectURL(f);const img=await loadImg(url);URL.revokeObjectURL(url);
    const k=Math.min(S.W/img.width,S.H/img.height,1);const w=img.width*k,h=img.height*k;
    structAction(()=>{const id=newDrawing(L);delete V[id];D[id].getContext('2d').drawImage(img,(S.W-w)/2,(S.H-h)/2,w,h);L.cells[S.frame]=id;});
    toast('Image placed on a new drawing');}catch(err){toast('Could not read that image');}};

async function newProject(){
  const {v,root}=await modal('New project',`
    <p>This replaces the current project. Save first if you want to keep it.</p>
    <div class="row"><span>Name</span><input id="npName" value="Untitled"></div>
    <div class="row"><span>Canvas size</span><select id="npSize"><option value="640x360">640 × 360 (light)</option><option value="960x540" selected>960 × 540</option><option value="1280x720">1280 × 720 (HD)</option><option value="1920x1080">1920 × 1080 (Full HD, heavy)</option><option value="1080x1080">1080 × 1080 (square)</option><option value="1080x1920">1080 × 1920 (vertical)</option></select></div>
    <div class="row"><span>Frames per second</span><input id="npFps" type="number" min="1" max="60" value="12"></div>
    <div class="row"><span>Length (frames)</span><input id="npFrames" type="number" min="1" max="2000" value="24"></div>
    <div class="row"><span>Paper color</span><input id="npPaper" type="color" value="#ffffff"></div>`,
    [{label:'Cancel',v:null},{label:'Create',v:'ok',primary:true}]);
  if(v!=='ok')return;
  const [W,H]=root.querySelector('#npSize').value.split('x').map(Number);
  freshProject(root.querySelector('#npName').value,W,H,clamp(+root.querySelector('#npFps').value||12,1,60),clamp(+root.querySelector('#npFrames').value||24,1,2000),root.querySelector('#npPaper').value);
}

async function exportMenu(){
  stop();
  const {v}=await modal('Export',`<div class="list">
    <button class="btn" data-v="png">Current frame<small>One PNG image of frame ${S.frame+1}</small></button>
    <button class="btn" data-v="zip">Image sequence<small>Every frame as a numbered PNG, in a ZIP. Works with any editor or compositor.</small></button>
    <button class="btn" data-v="video">Video<small>MP4 or WebM, depending on your browser, with the sound unless it is muted. Plays once in real time while it records.</small></button>
    <button class="btn" data-v="json">Project file<small>Everything needed to keep working later, sound included (JSON)</small></button></div>
    <p style="margin-top:12px">Images and video are framed by the camera.</p>`,[{label:'Cancel',v:null}]);
  if(v==='png')exportPng();
  else if(v==='zip')exportZip();else if(v==='video')exportVideo();else if(v==='json')saveProject();
}
async function exportZip(view,name){const nm=name||slug();
  if(!window.JSZip){toast('The ZIP library did not load. Check your connection and reload.');return;}
  const pm=progressModal('Exporting image sequence');const zip=new JSZip();const c=mkCanvas(),x=c.getContext('2d');
  try{for(let f=0;f<S.frames;f++){renderFrame(x,f,{camera:true,view});zip.file(`${nm}_${String(f+1).padStart(4,'0')}.png`,await toBlob(c));pm.set((f+1)/S.frames*0.8,`Frame ${f+1} of ${S.frames}`);}
    if(S.audio){const ext=(S.audio.name.match(/\.[a-z0-9]+$/i)||['.audio'])[0];zip.file(`${slug()}_sound${ext}`,S.audio.bytes);
      if(S.audio.start>0)zip.file('sound_start.txt',`The sound starts on frame ${S.audio.start+1} at ${S.fps} fps.`);}
    pm.set(0.9,'Packing ZIP…');const blob=await zip.generateAsync({type:'blob'});pm.close();await saveFile(nm+'_frames.zip',blob);}
  catch(e){pm.close();toast('Export failed: '+e.message);}
}
async function exportVideo(view,name){const nm=name||slug();
  const c=mkCanvas();
  if(!c.captureStream||typeof MediaRecorder==='undefined'){toast('This browser cannot record video. Use the image sequence instead.');return;}
  const withSound=!!(S.audio&&!S.audio.mute&&AC());
  const types=withSound?['video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs="avc1,mp4a"','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/mp4','video/webm']
    :['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=types.find(t=>{try{return MediaRecorder.isTypeSupported(t);}catch(_){return false;}});
  if(!mime){toast('No supported video format in this browser. Use the image sequence instead.');return;}
  c.style.cssText='position:fixed;left:-10000px;top:0;width:2px;height:2px';document.body.append(c);
  const x=c.getContext('2d');renderFrame(x,0,{camera:true,view});
  const pm=progressModal('Recording video');pm.set(0,'Keep this tab open while it records.');
  try{
    const stream=c.captureStream(S.fps);const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});
    const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};const done=new Promise(r=>rec.onstop=r);
    let aSrc=null,dest=null;if(withSound){dest=actx.createMediaStreamDestination();dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));}
    rec.start(250);if(dest)aSrc=soundSource(0,dest);const dt=1000/S.fps;const t0=performance.now();
    for(let f=0;f<S.frames;f++){renderFrame(x,f,{camera:true,view});const tr=stream.getVideoTracks()[0];if(tr&&tr.requestFrame)tr.requestFrame();
      await sleep(Math.max(0,t0+(f+1)*dt-performance.now()));pm.set((f+1)/S.frames,`Frame ${f+1} of ${S.frames}. Keep this tab open.`);}
    await sleep(120);if(aSrc){try{aSrc.stop();}catch(_){}}rec.stop();await done;stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(chunks,{type:mime.split(';')[0]});pm.close();c.remove();
    await saveFile(`${nm}.${mime.includes('mp4')?'mp4':'webm'}`,blob);
  }catch(e){pm.close();c.remove();toast('Video export failed: '+e.message);}
}

function help(){
  modal('How Celwerx works',`
  <p>Each layer is a row on the timeline. Each cell holds a drawing. A dark blue cell continues (holds) the drawing to its left, so one drawing can be exposed for several frames, the way animators shoot on twos.</p>
  <p>Draw on an empty cell and a new drawing is made for you. Drawing on a held cell changes that drawing everywhere it is exposed. Use Duplicate to make an independent copy first.</p>
  <table>
  <tr><td>Palette</td><td>Brushes in the palette panel save a tool, size and smoothing: tap one to switch to it, Save brush to keep the current one, Update to overwrite it. Open the palette panel to add the current color, rename or recolor a swatch, or delete it. Each project has its own palette. Export saves it as a file, Import brings one into another project.</td></tr>
  <tr><td>A</td><td>Select vector lines and fills: tap one, Shift+tap to add, or drag a box. Drag to move, corners to scale, the round handle to rotate. Delete removes, a color or Size change restyles them, Ctrl/Cmd+A selects all.</td></tr>
  <tr><td>Q</td><td>Edit points: tap a vector line or fill to show its points. Drag a point to reshape (raise Falloff to pull nearby points too), tap the line between points to add one, Delete removes the selected point. Smooth line evens out a wobbly line.</td></tr>
  <tr><td>W</td><td>Envelope warp: a 4 by 4 grid of 16 points wraps the drawing (or the selected vector lines). Drag any point to bend the drawing smoothly from that spot, or drag inside the envelope to move it all. Reset envelope undoes the shape; New envelope starts fresh around the drawing as it is now. Works on vector and bitmap drawings.</td></tr>
  <tr><td>X</td><td>Cutter: draw a loop around part of a drawing. Vector lines are split at the loop and the inside is selected, ready to move or delete. On bitmap drawings the pixels lift out and can be dragged. To new layer moves the cut onto its own layer, handy for cutting a one-piece character into parts before Auto-rig. Fills are cut whole.</td></tr>
  <tr><td>B E F L R C I</td><td>Brush, eraser, bucket, line, rectangle, ellipse, color picker</td></tr>
  <tr><td>Space + drag</td><td>Pan (two fingers on touch screens, which also pinch to zoom)</td></tr>
  <tr><td>[ and ]</td><td>Smaller / larger brush</td></tr>
  <tr><td>, and .</td><td>Previous / next frame (arrow keys work too)</td></tr>
  <tr><td>Up / Down</td><td>Select layer above / below</td></tr>
  <tr><td>Enter</td><td>Play / pause</td></tr>
  <tr><td>N</td><td>New blank drawing on this frame</td></tr>
  <tr><td>D</td><td>Duplicate the current drawing onto this frame</td></tr>
  <tr><td>H</td><td>Hold the previous drawing here, then step forward</td></tr>
  <tr><td>Delete</td><td>Empty this cell</td></tr>
  <tr><td>O</td><td>Onion skin on / off (red is before, green is after). Range opens the onion bars: ten frames back and ten ahead, each with its own strength. The frame numbers on the timeline light up to show the range.</td></tr>
  <tr><td>K</td><td>Camera tool: drag to move the frame, scroll to zoom, or use Cam zoom and Rotate. Any change sets a key on the current frame.</td></tr>
  <tr><td>J</td><td>Bone tool. Build mode: drag to draw a bone, drag from the tip of the selected bone to chain the next one, drag ends to adjust. Pose mode: drag a bone to rotate it, drag its round joint to move it. Each change sets a key.</td></tr>
  <tr><td>IK</td><td>With IK on, drag the tip of a bone (a hand, a foot) and the chain above it bends to follow. Choose 2 to 4 bones.</td></tr>
  <tr><td>Stretch / Width</td><td>Squash and stretch the selected bone on this frame. Parts attached to it stretch too.</td></tr>
  <tr><td>Timeline drag</td><td>Drag a drawing to move it in time (hold Alt to copy). Drop it on the first frame of another drawing to swap the two. Drag a drawing's right edge to hold it longer or shorter. Camera and bone keys drag along their rows too.</td></tr>
  <tr><td>S, ; and '</td><td>Swap the drawing for this exposure, or flip to the previous / next drawing of the layer</td></tr>
  <tr><td>P</td><td>Rest pose on / off: shows rigged layers unposed so you can fix drawings.</td></tr>
  <tr><td>V</td><td>Camera view on / off. You can keep drawing while looking through the camera.</td></tr>
  <tr><td>Ctrl/Cmd + Z</td><td>Undo (add Shift to redo)</td></tr>
  <tr><td>Ctrl/Cmd + S</td><td>Save project file</td></tr>
  <tr><td>G</td><td>Node editor: each layer is a box. Wire layers through effects (blur, glow, color adjust, tint, drop shadow, outline, fade, move and scale) and combine boxes (mask, blend, stack) into Output, which is what the camera films and exports. Drag from a box's right port to another box's left port to connect, drop a wire on empty space to add a box there, drag a wire off a port to disconnect. Preview selected shows any box's result on the canvas.</td></tr>
  <tr><td>1 and 2</td><td>Zoom out and in. With the mouse over the canvas they zoom the drawing; over the timeline they zoom the timeline.</td></tr>
  <tr><td>0, +, −</td><td>Fit the drawing, zoom in, zoom out (Ctrl + scroll also zooms)</td></tr>
  </table>
  <p>Camera: the purple frame shows what the camera sees. Set keys on two frames and it moves between them, either at a steady speed or with Ease in/out. Keys show as diamonds on the Camera row.</p>
  <p>Rigging: select a bone, then set the current layer to <i>Follows selected bone</i> (a rigid cut-out part) or <i>Bends with selected bones</i> (the drawing bends smoothly across the joints of that bone, the bones below it and its parent). <i>Auto</i> on the Bones row rigs a character two ways: from parts on separate layers, or from one drawing where you tap the joints (root first, then outward along each limb; tap an existing joint to branch). Parts bend at the joints by default. Rigid parts can be drawn on in any pose; bending layers are drawn on in Rest pose.</p>
  <p>Weights: turn on Paint weights, select a bone, and paint over a bending layer. Dots show that bone's pull, from blue (none) to red (full). Add increases it, Remove decreases it.</p>
  <p>Sound: add a file from the Sound row. Its waveform lines up with the frames, and stepping through frames plays a short slice so you can time mouth shapes. Use the gear button to set the start frame, volume or remove it.</p>
  <p>Vector and bitmap: the V or B next to a layer's name says what new drawings on it will be. Vector drawings are stored as editable lines and fill shapes, so they stay sharp when you zoom, move the camera or stretch bones. The eraser cuts vector lines, and the bucket makes fill shapes that sit under the lines. Bitmap drawings are pixels, like a painting app. New layers are vector.</p>
  <p>Pen pressure works with a stylus. When a pen is detected, finger touches pan instead of drawing, so you can rest your hand on the screen.</p>
  <p>Work is kept in this browser automatically while it fits. Use Save for a project file you can open anywhere.</p>`);
}

// ---------- Autosave ----------
const KEY='celstudio.autosave.v1';let saveT=0,autosaveOK=true;
function scheduleSave(){if(!autosaveOK)return;clearTimeout(saveT);saveT=setTimeout(doAutosave,4000);}
function doAutosave(){if(S.playing||act){scheduleSave();return;}
  try{localStorage.setItem(KEY,JSON.stringify(serialize(false)));setStatus('Kept in this browser');}
  catch(e){autosaveOK=false;setStatus('Too large to keep in this browser. Use Save.');}}

// ---------- Boot ----------
buildTools();
let lastAreaW=0;new ResizeObserver(()=>{const w=area.clientWidth;if(Math.abs(w-lastAreaW)>40){lastAreaW=w;fit();}}).observe(area);
(async()=>{
  let restored=false;
  let aj=null;try{aj=JSON.parse(localStorage.getItem(AKEY)||'null');}catch(_){}
  try{const s=localStorage.getItem(KEY);if(s){await loadProject(JSON.parse(s));restored=true;setStatus('Restored from this browser');}}catch(_){}
  if(restored&&aj){try{await loadAudioJSON(aj);}catch(_){}}
  if(!restored)freshProject('Untitled',960,540,12,24,'#ffffff');
  setTimeout(fit,50);
})();
